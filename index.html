<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P3 SharePoint Folder Structure</title>
<style>
  :root { --p3-blue: #004685; --p3-light: #D9E1F2; --text: #222; --muted: #6b7280; --border: #e5e7eb; }
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f7f8fa; color: var(--text); }
  h1 { color: var(--p3-blue); margin: 0 0 8px 0; font-size: 22px; }
  .sub { color: var(--muted); margin-bottom: 16px; font-size: 13px; }
  .controls { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: #fff; }
  input[type=text] { min-width: 260px; }
  select { min-width: 150px; cursor: pointer; }
  button { padding: 8px 14px; background: var(--p3-blue); color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.alt { background: #fff; color: var(--p3-blue); border: 1px solid var(--p3-blue); }
  .label { font-size: 13px; color: var(--muted); margin-right: -4px; }
  .tree { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
  ul { list-style: none; padding-left: 18px; margin: 2px 0; }
  li { position: relative; padding: 2px 0; line-height: 1.5; }
  .node { cursor: pointer; user-select: none; display: inline-block; padding: 2px 6px; border-radius: 4px; }
  .node:hover { background: var(--p3-light); }
  .caret::before { content: "\25B6"; display: inline-block; width: 14px; font-size: 10px; color: var(--p3-blue); transition: transform 0.15s; }
  .open > .node .caret::before { transform: rotate(90deg); }
  .leaf .caret::before { content: ""; }
  .leaf > .node { cursor: default; color: var(--muted); }
  .count { color: var(--muted); font-size: 12px; margin-left: 6px; }
  li > ul { display: none; }
  li.open > ul { display: block; }
  .level-0 > .node { font-weight: 700; color: var(--p3-blue); font-size: 15px; }
  .level-1 > .node { font-weight: 600; color: #264653; }
  .level-2 > .node { font-weight: 500; color: #334155; }
  .hidden { display: none !important; }
  .match { background: #fff3bf; }
  .empty { padding: 32px; text-align: center; color: var(--muted); font-style: italic; }
  .stats { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
  <h1>P3 SharePoint &mdash; Folder Structure</h1>
  <div class="sub">Drill down: Country &rarr; Group &rarr; Site type &rarr; [Department] &rarr; Library &rarr; Folders.</div>
  <div class="controls">
    <span class="label">Country:</span><select id="country"></select>
    <input type="text" id="q" placeholder="Search folder name&hellip;">
    <button onclick="expandAll()">Expand all</button>
    <button class="alt" onclick="collapseAll()">Collapse all</button>
  </div>
  <div id="tree" class="tree"></div>
  <div id="stats" class="stats"></div>

function countLeaves(n){if(typeof n!=='object'||n===null)return 1; const k=Object.keys(n); return k.length===0?1:k.reduce((s,x)=>s+countLeaves(n[x]),0);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(name,node,depth){
  const keys=Object.keys(node||{}),isLeaf=keys.length===0;
  const li=document.createElement('li');
  li.classList.add('level-'+Math.min(depth,3));
  if(isLeaf) li.classList.add('leaf');
  const span=document.createElement('span'); span.className='node';
  span.innerHTML=`<span class="caret"></span>${escapeHtml(name)}${!isLeaf?`<span class="count">${countLeaves(node)}</span>`:''}`;
  li.appendChild(span);
  span.addEventListener('click',()=>{if(!isLeaf)li.classList.toggle('open');});
  if(!isLeaf){const ul=document.createElement('ul'); for(const k of keys)ul.appendChild(render(k,node[k],depth+1)); li.appendChild(ul);}
  return li;
}
const countries=Object.keys(data).sort();
const sel=document.getElementById('country');
const allOpt=document.createElement('option'); allOpt.value='__ALL__'; allOpt.textContent=`All (${countries.length})`; sel.appendChild(allOpt);
for(const c of countries){const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);}
const treeEl=document.getElementById('tree');
const statsEl=document.getElementById('stats');
function build(filter){
  treeEl.innerHTML='';
  const rootUl=document.createElement('ul');
  const shown = filter==='__ALL__' ? countries : [filter];
  const GROUP_LABELS = new Set(["Asset Space","Investment Projects","Other"]);
  let leafTotal=0, typeTotal=0;
  for(const c of shown){
    if(!data[c]) continue;
    rootUl.appendChild(render(c, data[c], 0));
    const node = data[c];
    for(const k of Object.keys(node)){
      if(GROUP_LABELS.has(k)) typeTotal += Object.keys(node[k]).length;
      else typeTotal += 1;
    }
    leafTotal += countLeaves(node);
  }
  if(!rootUl.children.length){treeEl.innerHTML='<div class="empty">No data for this country.</div>'; statsEl.textContent=''; return;}
  treeEl.appendChild(rootUl);
  rootUl.querySelectorAll(':scope > li').forEach(li => li.classList.add('open'));
  statsEl.textContent = `${shown.length} ${shown.length===1?'country':'countries'} · ${typeTotal} site-type entries · ${leafTotal} leaf folders`;
}
function expandAll(){document.querySelectorAll('#tree li').forEach(li=>{if(!li.classList.contains('leaf'))li.classList.add('open');});}
function collapseAll(){document.querySelectorAll('#tree li').forEach(li=>li.classList.remove('open')); document.querySelectorAll('#tree > ul > li').forEach(li=>li.classList.add('open'));}
sel.addEventListener('change',()=>{build(sel.value); document.getElementById('q').value='';});
document.getElementById('q').addEventListener('input',e=>{
  const term=e.target.value.trim().toLowerCase();
  const all=document.querySelectorAll('#tree li');
  if(!term){all.forEach(li=>{li.classList.remove('hidden');const n=li.querySelector(':scope > .node'); if(n)n.classList.remove('match');}); collapseAll(); return;}
  all.forEach(li=>{li.classList.add('hidden'); const n=li.querySelector(':scope > .node'); if(n)n.classList.remove('match');});
  all.forEach(li=>{const lbl=li.querySelector(':scope > .node').textContent.toLowerCase();
    if(lbl.includes(term)){li.classList.remove('hidden'); li.querySelector(':scope > .node').classList.add('match');
      let p=li.parentElement; while(p&&p.id!=='tree'){if(p.tagName==='LI'){p.classList.remove('hidden'); p.classList.add('open');} p=p.parentElement;}
      li.querySelectorAll('li').forEach(d=>d.classList.remove('hidden'));
      if(!li.classList.contains('leaf'))li.classList.add('open');
    }
  });
});
build('__ALL__');
